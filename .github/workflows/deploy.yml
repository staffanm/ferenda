# Continuous deploy to the lagen.nu prod host (ferenda.lagen.nu).
#
# Runs on a SELF-HOSTED runner (`lagen-nu`) installed on the host as the
# `staffan` user, in the docker group -- see docs/operating/README.md.
#
# The host runs ONE merged docker compose project that fronts both sites behind a
# single nginx: the legacy site AND the rebuilt one. Two on-box checkouts:
#
#   ~/wds/ferenda         this branch. It is BOTH the compose project and the
#                         build context for the `ferenda` image, so the deploy
#                         resets this tree to the pushed commit and drives
#                         compose from it.
#   ~/wds/ferenda-legacy  the `legacy` branch, bind-mounted into the
#                         `ferenda-legacy` service. Frozen; nothing here
#                         touches it.
#
# On every push to the deployed branch the deploy fast-forwards ~/wds/ferenda and
# rebuilds + restarts ONLY the `ferenda` service (the legacy stack is left
# untouched), then publishes the static browser chrome. It is a PURE CODE DEPLOY --
# it processes no data.
#
# The chrome (style.css + the script.js bundle, lib/assets/) is the one part of the
# code that does NOT ride the image: the pages link it by URL and the serve reads it
# out of `generated/`, the corpus tree. So an image-only deploy shipped new API
# routes to a browser still running the old bundle -- the PDF export's job endpoints
# (/api/v1/pdf/vanta) went live on 2026-08-18 and the reader kept getting the old
# one-long-request dialog, because nothing had rewritten generated/script.js. The
# publish step below closes that gap. It is code, not data: `--assets-only` copies
# four files out of the checkout and reads neither the catalog nor an artifact.
#
# Folding new input DATA into the corpus is deliberately NOT done here: a code push
# must not trigger a reparse/regenerate (the host can't re-parse ~100K förarbeten
# within a deploy's budget -- the from-scratch reparse blew past GitHub's 6h ceiling
# and was cancelled). Data reaches the host two other ways: a code-driven rebuild is
# done on the fast dev box and pushed up with `sync-up`, and the nightly host cron
# `lagen all all` (download + rebuild) folds in fresh source data incrementally.
#
# No secrets travel through GitHub: the runner already sits on the host with the
# checkouts, the corpus and docker access.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow a manual redeploy from the Actions tab

# Never let two deploys run at once (a rebuild can take a while); queue instead
# of cancelling a rebuild already in flight.
concurrency:
  group: lagen-nu-deploy
  cancel-in-progress: false

jobs:
  # Tests, lint, types and the layer rule, on a GitHub-hosted runner. The
  # deploy waits for it: a push used to go straight to `docker compose build`
  # on the production host, so a commit that did not import was found by
  # readers rather than by CI.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: [self-hosted, lagen-nu]
    # No actions/checkout: we deploy the persistent on-box checkout, not the
    # runner's throwaway workspace.
    env:
      # one directory now: the checkout, the image build context and the
      # compose project are all this branch.
      CODE: /home/staffan/wds/ferenda
    steps:
      - name: Update the on-box code checkout to the pushed commit
        run: |
          set -euo pipefail
          cd "$CODE"
          # A prior run cancelled part way through (e.g. a rebuild timeout) can
          # leave a stale lock that fails the next fetch/reset with exit 128.
          # Only a lock nothing can still own is removed: an hour is far longer
          # than any operation here takes, and deleting a live one corrupts the
          # repository of whoever holds it.
          for lock in .git/index.lock .git/shallow.lock .git/refs/remotes/origin/*.lock; do
            [ -e "$lock" ] || continue
            if [ -n "$(find "$lock" -mmin +60 2>/dev/null)" ]; then
              echo "removing stale $lock (older than an hour)" >&2
              rm -f "$lock"
            else
              echo "$lock exists and is recent -- something may still hold it." >&2
              echo "Stopping here; remove it by hand to continue." >&2
              exit 1
            fi
          done
          # `reset --hard` below destroys uncommitted work in this tree, and
          # this tree holds the bind-mounted nginx confs -- edited on the host
          # more than once. Keep a copy of whatever is about to be lost.
          if [ -n "$(git status --porcelain)" ]; then
            mkdir -p ~/wds/deploy-lost
            patch=~/wds/deploy-lost/$(date +%Y%m%d-%H%M%S).patch
            git diff HEAD > "$patch"
            git status --porcelain > "$patch.status"
            echo "the checkout was dirty; saved the diff to $patch" >&2
          fi
          # Retry the fetch: transient GitHub connectivity has intermittently 128'd
          # this step (it self-heals on the next push, but shouldn't fail a deploy).
          # git's own stderr is printed, so a genuine, persistent failure is visible.
          for attempt in 1 2 3; do
            if git fetch --prune origin; then break; fi
            [ "$attempt" = 3 ] && { echo "git fetch failed after 3 attempts" >&2; exit 1; }
            echo "git fetch failed (attempt $attempt/3); retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          git reset --hard "${GITHUB_SHA}"

      - name: Build the ferenda image
        run: |
          set -euo pipefail
          cd "$CODE"
          # Keep the image that is serving right now under a fixed tag, so the
          # rollback step has something to put back. `docker compose build`
          # overwrites the project's tag, and without this the previous image
          # becomes a dangling layer nobody can name.
          current="$(docker compose images -q ferenda || true)"
          if [ -n "$current" ]; then
            docker tag "$current" lagen-ferenda:previous
            echo "$current" > /tmp/ferenda-previous-image
          fi
          # bake the deployed revision into the image (the ops dashboard reads it);
          # .git is dockerignored, so there's no repo to rev-parse at runtime.
          GIT_SHA="${GITHUB_SHA}" docker compose build ferenda

      - name: Restart the ferenda service (legacy stack left untouched)
        run: |
          set -euo pipefail
          cd "$CODE"
          docker compose --profile prod up -d ferenda

      # `up -d` returning says the container started, nothing more. The
      # container's health check asks the app itself (/healthz: it imported,
      # the catalog reads, the generated tree is mounted -- see api/app.py), so
      # this waits for that to pass. Before this step existed, a release that
      # started and answered 500 to everything was reported as a successful
      # deploy.
      - name: Wait for the app to report healthy
        id: health
        run: |
          set -euo pipefail
          cd "$CODE"
          for attempt in $(seq 1 60); do
            cid="$(docker compose ps -q ferenda || true)"
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            echo "ferenda health is '${status:-unknown}' -- waiting ($attempt/60)"
            sleep 5
          done
          echo "ferenda never became healthy" >&2
          docker compose logs --tail 100 ferenda >&2
          exit 1

      # Through nginx, the way a reader arrives: the health check above talks to
      # the app on the compose network, which says nothing about the proxy in
      # front of it. One document page and the API's own root.
      - name: Smoke-test the public site
        run: |
          set -euo pipefail
          # Two small JSON answers, fetched whole.
          for path in /healthz /api/v1/sources; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                    --resolve lagen.nu:443:127.0.0.1 "https://lagen.nu$path")"
            echo "GET $path -> $code"
            [ "$code" = 200 ] || { echo "$path answered $code" >&2; exit 1; }
          done
          # One real document page, to prove the bare-URL grammar still
          # resolves (/1962:700 -> generated/1962:700.html, inside the app, not
          # in nginx). HEAD, not GET: this is the most stable URL in the
          # corpus and also one of the largest pages in it, and the status code
          # is the whole answer a smoke test needs.
          code="$(curl -sS -I -o /dev/null -w '%{http_code}' \
                  --resolve lagen.nu:443:127.0.0.1 https://lagen.nu/1962:700)"
          echo "HEAD /1962:700 -> $code"
          [ "$code" = 200 ] || { echo "/1962:700 answered $code" >&2; exit 1; }
          # the headers the vhost is supposed to add (docker/nginx/*.conf)
          headers="$(curl -sSI --resolve lagen.nu:443:127.0.0.1 https://lagen.nu/)"
          for header in Strict-Transport-Security X-Content-Type-Options \
                        Content-Security-Policy X-Frame-Options; do
            echo "$headers" | grep -qi "^$header:" \
              || { echo "missing $header" >&2; exit 1; }
          done

      # The pages link /style.css and /script.js by URL, and the serve reads them
      # from `generated/` -- a bind-mounted host tree, not the image. Without this
      # the deploy ships new code to a browser still running the old bundle.
      #
      # Runs INSIDE the container on purpose: generated/ lives on the root_squashed
      # /mnt/forstor NFS export, writable only by gid 3362, which the image's `app`
      # user carries (docker-compose.yml build args). A host-side `lagen` would
      # EPERM. It writes four files (script.js, style.css, graf.js, robots.txt, each
      # Brotli-precompressed) plus the font woff2s, reads no catalog and re-renders
      # no page, so it costs seconds -- see build.cmd_generate's `--assets-only`
      # branch, which returns before the fingerprint gate and so never skips.
      #
      # No nginx reload and no second restart: this vhost proxies everything to the
      # app (docker/nginx/ferenda.lagen.nu.conf `location /`), and the serve reads
      # the asset off disk per request rather than memoizing it at import.
      - name: Publish the static browser chrome (style.css + the script bundle)
        run: |
          set -euo pipefail
          cd "$CODE"
          # `up -d` returns once the container is started, but a recreate can still
          # be a moment short of accepting an exec ("container is restarting").
          # Wait for `running` first, so a real failure below is the command's own
          # and not a race we retried over.
          for attempt in $(seq 1 30); do
            # `|| true`: mid-recreate the container id can vanish between the two
            # calls, and pipefail would turn that race into a failed deploy. An
            # empty state just means "not yet" -- retry, and let the exec below be
            # the thing that fails if it never comes up.
            state="$(docker compose ps -q ferenda \
                     | xargs -r docker inspect -f '{{.State.Status}}' || true)"
            [ "$state" = running ] && break
            echo "ferenda is '${state:-absent}' -- waiting ($attempt/30)"
            sleep 2
          done
          docker compose exec -T ferenda lagen all generate --assets-only

      # Put the previous image back when the candidate does not come up. The
      # site is then serving the release before this one, which is a working
      # site -- the alternative is a container that restarts forever while
      # nobody is looking.
      - name: Roll back to the previous image
        if: failure()
        run: |
          set -euo pipefail
          cd "$CODE"
          [ -f /tmp/ferenda-previous-image ] || { echo "no previous image recorded" >&2; exit 1; }
          docker tag "$(cat /tmp/ferenda-previous-image)" lagen-ferenda:current
          docker compose --profile prod up -d ferenda
          echo "rolled back to the image that was serving before this run" >&2
