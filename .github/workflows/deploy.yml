# Continuous deploy to the lagen.nu prod host (ferenda.lagen.nu).
#
# Runs on a SELF-HOSTED runner (`lagen-nu`) installed on the host as the
# `staffan` user, in the docker group -- see docs/operating/README.md.
#
# The host runs ONE merged docker compose project that fronts both sites behind a
# single nginx: the legacy lagen.nu stack AND the rebuilt accommodanda site
# (ferenda.lagen.nu). Two on-box checkouts, distinct roles:
#
#   ~/wds/accommodanda  the modernization code + build context for the
#                       accommodanda image (this repo/branch). THIS is what the
#                       deploy fast-forwards to the pushed commit.
#   ~/wds/ferenda       the operational compose project. Its docker-compose.yml
#                       builds the accommodanda service from `../accommodanda`,
#                       and owns the legacy services + the shared nginx/certbot.
#                       Mostly frozen -- the deploy only drives compose from here,
#                       it does NOT reset this tree.
#
# On every push to the deployed branch the deploy fast-forwards ~/wds/accommodanda
# and rebuilds + restarts ONLY the accommodanda service (the legacy stack is left
# untouched), then publishes the static browser chrome. It is a PURE CODE DEPLOY --
# it processes no data.
#
# The chrome (style.css + the script.js bundle, lib/assets/) is the one part of the
# code that does NOT ride the image: the pages link it by URL and the serve reads it
# out of `generated/`, the corpus tree. So an image-only deploy shipped new API
# routes to a browser still running the old bundle -- the PDF export's job endpoints
# (/api/v1/pdf/vanta) went live on 2026-08-18 and the reader kept getting the old
# one-long-request dialog, because nothing had rewritten generated/script.js. The
# publish step below closes that gap. It is code, not data: `--assets-only` copies
# four files out of the checkout and reads neither the catalog nor an artifact.
#
# Folding new input DATA into the corpus is deliberately NOT done here: a code push
# must not trigger a reparse/regenerate (the host can't re-parse ~100K förarbeten
# within a deploy's budget -- the from-scratch reparse blew past GitHub's 6h ceiling
# and was cancelled). Data reaches the host two other ways: a code-driven rebuild is
# done on the fast dev box and pushed up with `sync-up`, and the nightly host cron
# `lagen all all` (download + rebuild) folds in fresh source data incrementally.
#
# No secrets travel through GitHub: the runner already sits on the host with the
# checkouts, the corpus and docker access.

name: deploy

on:
  push:
    branches: [modernization]
  workflow_dispatch: {}   # allow a manual redeploy from the Actions tab

# Never let two deploys run at once (a rebuild can take a while); queue instead
# of cancelling a rebuild already in flight.
concurrency:
  group: lagen-nu-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lagen-nu]
    # No actions/checkout: we deploy the persistent on-box checkout, not the
    # runner's throwaway workspace.
    env:
      CODE: /home/staffan/wds/accommodanda   # git checkout + accommodanda build context
      COMPOSE: /home/staffan/wds/ferenda      # the merged operational compose project
    steps:
      - name: Update the on-box code checkout to the pushed commit
        run: |
          set -euo pipefail
          cd "$CODE"
          # A prior run cancelled mid-git (e.g. a rebuild timeout) can leave a
          # stale lock that fails the next fetch/reset with exit 128; clear it first.
          rm -f .git/index.lock .git/shallow.lock .git/refs/remotes/origin/*.lock || true
          # Retry the fetch: transient GitHub connectivity has intermittently 128'd
          # this step (it self-heals on the next push, but shouldn't fail a deploy).
          # git's own stderr is printed, so a genuine, persistent failure is visible.
          for attempt in 1 2 3; do
            if git fetch --prune origin; then break; fi
            [ "$attempt" = 3 ] && { echo "git fetch failed after 3 attempts" >&2; exit 1; }
            echo "git fetch failed (attempt $attempt/3); retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          git reset --hard "${GITHUB_SHA}"

      - name: Build the accommodanda image
        run: |
          set -euo pipefail
          cd "$COMPOSE"
          # bake the deployed revision into the image (the ops dashboard reads it);
          # .git is dockerignored, so there's no repo to rev-parse at runtime.
          GIT_SHA="${GITHUB_SHA}" docker compose build accommodanda

      - name: Restart the accommodanda service (legacy stack left untouched)
        run: |
          set -euo pipefail
          cd "$COMPOSE"
          docker compose --profile prod up -d accommodanda

      # The pages link /style.css and /script.js by URL, and the serve reads them
      # from `generated/` -- a bind-mounted host tree, not the image. Without this
      # the deploy ships new code to a browser still running the old bundle.
      #
      # Runs INSIDE the container on purpose: generated/ lives on the root_squashed
      # /mnt/forstor NFS export, writable only by gid 3362, which the image's `app`
      # user carries (docker-compose.prod.yml build args). A host-side `lagen` would
      # EPERM. It writes four files (script.js, style.css, graf.js, robots.txt, each
      # Brotli-precompressed) plus the font woff2s, reads no catalog and re-renders
      # no page, so it costs seconds -- see build.cmd_generate's `--assets-only`
      # branch, which returns before the fingerprint gate and so never skips.
      #
      # No nginx reload and no second restart: this vhost proxies everything to the
      # app (docker/nginx/ferenda.lagen.nu.conf `location /`), and the serve reads
      # the asset off disk per request rather than memoizing it at import.
      - name: Publish the static browser chrome (style.css + the script bundle)
        run: |
          set -euo pipefail
          cd "$COMPOSE"
          # `up -d` returns once the container is started, but a recreate can still
          # be a moment short of accepting an exec ("container is restarting").
          # Wait for `running` first, so a real failure below is the command's own
          # and not a race we retried over.
          for attempt in $(seq 1 30); do
            # `|| true`: mid-recreate the container id can vanish between the two
            # calls, and pipefail would turn that race into a failed deploy. An
            # empty state just means "not yet" -- retry, and let the exec below be
            # the thing that fails if it never comes up.
            state="$(docker compose ps -q accommodanda \
                     | xargs -r docker inspect -f '{{.State.Status}}' || true)"
            [ "$state" = running ] && break
            echo "accommodanda is '${state:-absent}' -- waiting ($attempt/30)"
            sleep 2
          done
          docker compose exec -T accommodanda lagen all generate --assets-only
