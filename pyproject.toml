[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ferenda"
version = "0.3.1.dev1"
description = "Transform unstructured document collections to structured Linked Data"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.14"
authors = [
    { name = "Staffan Malmgren", email = "staffan.malmgren@gmail.com" },
]
keywords = ["rdf", "linkeddata", "parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "beautifulsoup4",
    # Brotli codec for the on-disk artifact/ + generated/ compression
    # (lib/compress): ~3x smaller than gzip on the JSON/HTML payload and a
    # faster decompress; the served .br bytes are what nginx hands out as-is.
    "brotli",
    # x509 parsing for the AIA-completed trust bundle lib/net.mount_aia_chain
    # builds: lifos.migrationsverket.se serves only its leaf certificate, so the
    # intermediate has to be fetched from the AIA pointer the leaf carries
    "certifi",
    "cryptography",
    "fastapi",
    # starlette's TestClient (used in-process for static browse-page generation)
    # requires httpx2; without it starlette falls back to httpx with a deprecation
    # warning on every import.
    "httpx2[http2]",
    # a *different package* from httpx2 above, not a version of it: the 0.x line,
    # imported by its own module name (`import httpx`). lib/net.make_http2_session
    # builds its client from this one, so this is where the [http2] extra's h2
    # codec actually comes from -- what the foreskrift harvest engine needs for
    # the HTTP/2-only Cloudflare front on konkurrensverket.se (KKVFS). It reached
    # the venv transitively via mcp 1.x until the 2.0 bump dropped it; declared
    # here because we import it directly.
    "httpx[http2]",
    "jinja2>=3.1.6",
    "jpype1>=1.7.1",
    "langdetect",
    "lark",
    "lxml",
    # CommonMark + GFM tables for the editorial site markdown (site/parse.py).
    # It reached the venv transitively via rich; declared here because we import
    # it directly, the same reason httpx is spelled out above.
    "markdown-it-py",
    # the public MCP server mounted at /mcp (accommodanda/api/mcp.py) -- MCPServer +
    # the Streamable HTTP transport. >=2.0 is what speaks the 2026-07-28 protocol
    # revision (no initialize handshake, no Mcp-Session-Id); the 1.x line stops at
    # 2025-11-25 and is maintenance-only. One server still serves both eras.
    "mcp>=2.0",
    "opensearch-py",
    "pillow>=12.3.0",  # 12.2.0 carries PYSEC-2026-2253..2257
    # Headful, detached-CDP transport for the F5-protected SKVFS/MTFS registers.
    # It drives the system google-chrome; Playwright does not download a browser.
    "playwright>=1.61",
    "python-dotenv>=1.2.2",
    "rdflib",
    "requests",
    "ruamel-yaml>=0.19.1",
    "urllib3",
    # >=0.31: FORWARDED_ALLOW_IPS is matched with `ipaddress` from that
    # release on. Earlier versions compare the peer address as a literal
    # string, so the deployment's CIDR value would match nothing and every
    # request would silently keep the proxy's address.
    "uvicorn>=0.31",
    # HTML+CSS -> PDF for the /api/v1/pdf export (api/pdf.py): renders the
    # generated page through the same style.css print rules the browser uses,
    # and adds what browsers don't implement -- @page margin boxes, string-set
    # running headers, target-counter() TOC page numbers, PDF bookmarks.
    "weasyprint>=63",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pip-audit",
    "psutil",
    "pytest",
    "ruff",
    "ty",
]

# PEP 735 group: unlike optional-dependencies above, uv installs this on a
# plain `uv sync`, so `pytest` is available without `--extra dev`.
[dependency-groups]
dev = [
    "coverage",
    "html5lib>=1.1",
    "pip-audit",
    "psutil",
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
lagen = "accommodanda.build:main"

[project.urls]
Homepage = "https://github.com/staffanm/ferenda/"

[tool.setuptools.packages.find]
exclude = ["test", "docs", "site", "data"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
# the Jinja templates (and lib/assets, lib/data) must ship inside the wheel;
# include-package-data alone only picks up SCM-tracked files when a MANIFEST
# plugin is present. The glob must recurse: lib/templates/partials/*.html never
# matched the old flat "templates/*.html", so the shared macros shipped only by
# accident of the sdist.
"*" = ["templates/*.html", "templates/**/*.html", "assets/*", "assets/**/*",
       "data/*"]

# --- Linting / type checking ---
# Scoped to the active accommodanda/ package; the legacy ferenda/ and lagen/
# trees are out of scope. The .claude Stop hook runs `ruff check` + `ty check`
# on the accommodanda/ files edited each turn. Run the whole package by hand:
#   uv run ruff check accommodanda
#   uv run ty check accommodanda

[tool.ruff]
target-version = "py310"
# Only the rebuilt package; never lint the legacy tree.
include = ["accommodanda/**/*.py"]
extend-exclude = ["ferenda", "lagen", "site", "doc", "tools", "test"]

[tool.ruff.lint]
# High-signal sets, enforced by the Stop hook (see docs/conventions.md):
#   F (pyflakes), I (import grouping) — baseline
#   B (bugbear) — real bug shapes (zip strict, unused loop vars, ...)
#   BLE (blind except) — rule:no-catch-log-continue; the sanctioned
#       resilience points carry cited `# noqa: BLE001 — reason`
#   PLC0415 (in-function imports) — rule:no-infunction-imports
#   S110/S112 (try-except-pass/continue) — silent swallowing
#   RUF100 (unused noqa) — keeps the citations honest
# NOT enabled: ANN (package is mostly unannotated — measure on demand with
# `ruff check --select ANN`), ERA (5/5 false positives on prose comments),
# SIM/RET (would churn the deliberately-faithful tokenizer port).
select = ["F", "I", "B", "BLE", "PLC0415", "S110", "S112", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)`-in-default idiom.
"accommodanda/api/app.py" = ["B008"]
"accommodanda/api/ops.py" = ["B008"]
"accommodanda/api/auth.py" = ["B008"]
"accommodanda/api/edit.py" = ["B008"]
"accommodanda/api/patch.py" = ["B008"]
# Sanctioned in-function-import sites (rule:no-infunction-imports): POI/jpype
# classes resolve only after startJVM (poi_worker), and the playwright import
# is deferred so build workers never load the greenlet C extension they
# don't use.
"accommodanda/lib/poi_worker.py" = ["PLC0415"]
"accommodanda/lib/browser.py" = ["PLC0415"]

[tool.ty.src]
include = ["accommodanda"]

[tool.pytest.ini_options]
# Make a bare `pytest` (or `pytest test/`) collect exactly the new suites.
# The legacy unittest files (test/integration*.py, test/test[A-Z]*.py,
# test/functional*.py, examplerepos.py, quiet.py) don't import under modern
# Python and are out of scope -- never "fix" them (rule:legacy-read-only).
testpaths = ["test"]
python_files = ["test_*.py"]
# test/files/ is fixture data (some of it happens to be named test_*.py)
addopts = "--ignore=test/files"
