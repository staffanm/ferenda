# Definite-form subdomains (PRD-subdomains.md). One extra vhost on the front,
# terminating TLS for every subdomain of the four zones with the wildcard
# lineage the `certbot` service issues (docker-compose.yml). $sub_root comes
# from a build-generated map: empty for an unmapped host (mistyped name, or a
# zone whose content generation has not shipped yet), a directory name under
# generated/_sub/ otherwise.
#
# ferenda/subdomains.py writes both this map and the generated/_sub/ tree it
# points into. It symlinks the act's own generated file as-is -- often
# `.br`-only, no plain fallback -- rather than decompressing it, so this
# front has to serve that compression itself: there is no brotli_static
# module in this image (plain nginx:1.27-alpine) to do it automatically.
# subdomains.py only ever creates ONE variant per slug, so which of the
# three `location`s below fires is decided by which file exists, not by
# content negotiation; content negotiation only decides whether a `.br`/
# `.gz`-only page may be served raw at all, or must fall through to the
# apex instead of corrupting the response for a client that cannot decode
# it (rule:fail-fast -- wrong bytes with a 200 beat no page, wrongly).
map $host $sub_root {
    default "";
    include /usr/share/nginx/generated/subdomains.map;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^[a-z0-9-]+\.(lagen|direktivet|forordningen|xn--frordningen-rfb)\.nu$;
    ssl_certificate     /usr/share/nginx/certificates/wildcard/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certificates/wildcard/privkey.pem;

    root /usr/share/nginx/generated/_sub/$sub_root;
    # The served file is named index.html.br/.gz, not index.html -- nginx's
    # mime.types has no rule for those extensions, so without this every
    # landing page came back Content-Type: application/octet-stream and the
    # browser downloaded it instead of showing it (found live: a "download"
    # instead of a page). Every file this root ever serves is HTML.
    default_type text/html;

    # Mapped host, landing page: serve it, in whichever of plain/br/gz is the
    # one file subdomains.py actually created. Mapped host, unmapped (empty
    # $sub_root), missing file, or a compressed-only page whose client can't
    # decode it: the root, not a 404 or corrupt bytes -- a reader who typos a
    # law name, or hits a zone that has no content yet, should land on the
    # site.
    #
    # `add_header` is not a per-branch statement -- it applies to every
    # response the *location* it is written in ever produces, `if`s and all,
    # so a redirect issued by `return` inside the same location as
    # `add_header Content-Encoding br` would carry that header too (found
    # live: the apex redirect itself came back stamped `Content-Encoding:
    # br`, which is not what it is). `error_page 490 = @apex`, inherited from
    # here into every location below, hands the response to a genuinely
    # separate location instead, which has no add_header of its own.
    error_page 490 = @apex;

    location = / {
        try_files /index.html @try_br;
    }
    location @try_br {
        if ($http_accept_encoding !~ br) { return 490; }
        add_header Content-Encoding br always;
        try_files /index.html.br @try_gz;
    }
    location @try_gz {
        if ($http_accept_encoding !~ gzip) { return 490; }
        add_header Content-Encoding gzip always;
        try_files /index.html.gz @apex;
    }
    location / {
        return 301 https://ferenda.lagen.nu$request_uri;   # CUTOVER: -> lagen.nu
    }
    location @apex {
        return 301 https://ferenda.lagen.nu$request_uri;   # CUTOVER: -> lagen.nu
    }
}

# Three of the four apexes have no site of their own -- every request answers
# 301. lagen.nu needs no such block: it already is the site (legacy today,
# itself after the cutover).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name direktivet.nu forordningen.nu xn--frordningen-rfb.nu;
    ssl_certificate     /usr/share/nginx/certificates/wildcard/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certificates/wildcard/privkey.pem;
    return 301 https://ferenda.lagen.nu$request_uri;       # CUTOVER: -> lagen.nu
}
