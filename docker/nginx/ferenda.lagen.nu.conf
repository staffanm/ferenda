# The rebuilt site: ferenda.lagen.nu today, lagen.nu after the cutover.
#
# The `ferenda` service serves the whole thing from one uvicorn process: the REST APIs
# (the public /api/v1/* with /docs + /openapi.json, and the site's own
# /internal-api/v1/*, which the app itself limits to same-origin callers)
# answer first, everything else is the
# generated static site, and its SiteFiles handler resolves lagen.nu's bare
# document URLs (/2018:585, /dom/ad/1993:100, ...) internally. So nginx does
# not replicate the try_files/rewrite grammar the legacy lagen.nu vhost needs
# (default.conf) -- it just reverse-proxies every request to the app.
#
# The service name `ferenda` resolves on the compose network (see
# docker-compose.yml); the app listens on :8000.
#
# Switched 2026-09-05: this vhost answers lagen.nu, and the block at the foot
# of this file redirects the old ferenda.lagen.nu hostname here.

# The facsimile page images (/<source>/<basefile>/sidN.png) are rendered on
# demand, about one second of CPU each, and a scraper botnet -- thousands of
# residential addresses with browser user agents, plus a self-identified
# img2dataset crawler -- pulls every page of every scanned document. On
# 2026-09-05 it asked for 7-8 images a second, the queue outgrew the 60 s
# proxy timeout, and the app hit its open-file limit and stopped answering
# anything for an hour. The limit is on the host as a whole, not per client
# (a per-address limit is no limit against thousands of addresses): what
# exceeds the rate the app can render answers 429 at once instead of queueing.
#
# That legacy path and `/api/v1/facsimile` reach one renderer, so they share
# one zone. Two zones at two rates would let a client alternating entrances
# draw the sum of both past an edge whose whole job is to bound the crop queue.

# The API routes that render rather than read. `/api/v1/pdf` lays a document
# out with WeasyPrint; `/api/v1/facsimile` and `/api/v1/sfs-graphic` rasterize
# a PDF page with poppler. The app bounds all three -- two PDF workers, four
# poppler slots -- so what this adds is the 429 in front of that queue: a
# client asking for a hundred distinct documents is told to slow down at the
# edge instead of filling the queue and holding connections open for the
# length of it. Same host-wide shape as the facsimile zone, and for the same
# reason: a per-address limit is no limit against a residential-proxy botnet.
#
# Two zones, not one, because the costs differ by an order of magnitude and a
# shared bucket lets the cheap route starve the expensive one. A page of 325
# road signs asks for hundreds of crops; a PDF export is one request that runs
# for minutes. On one bucket the crops would empty it before the export
# arrived. `crop` keeps the 4r/s the 2026-09-05 incident was brought under --
# every crop entrance draws on it, so the rate means what it says.
limit_req_zone $server_name zone=export:1m rate=2r/s;
limit_req_zone $server_name zone=crop:1m rate=4r/s;
limit_req_status 429;

server {
    listen 80;
    server_name lagen.nu;

    # keep ACME http-01 challenges answerable (shared webroot with lagen.nu)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lagen.nu;

    # Shares lagen.nu's certificate files. Add `ferenda.lagen.nu` to the nginx
    # service's DOMAIN env (docker-compose.yml) so the ACME client reissues one
    # SAN cert covering both names. Referencing the existing files means nginx
    # still boots before that reissue -- TLS just warns for this name until then.
    ssl_certificate /usr/share/nginx/certificates/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certificates/privkey.pem;
    include /etc/ssl-options/options-nginx-ssl.conf;
    ssl_dhparam /etc/ssl-options/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    client_max_body_size 4m;
    server_tokens off;                 # don't advertise the nginx version

    # Server-scope headers reach the proxied response because `location /`
    # declares no add_header of its own (nginx replaces, never merges, per
    # location). No X-Robots-Tag here: this is the indexed site since
    # 2026-09-05; old.lagen.nu (default.conf) carries the noindex.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Nothing here is meant to be framed, and the site draws every asset from
    # its own origin (the Matomo tracker included -- lib/assets/matomo.js posts
    # to /matomo/, an nginx block on this host). So these four are enforced
    # today: they need no inventory of what the pages do.
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy
        "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # The script and style directives are report-only until the inline blocks
    # carry nonces. The generated pages open with three inline scripts (the
    # theme flip, the canonical <base>, the JSON context island) and the
    # rendered documents carry style attributes, so an enforced 'self' policy
    # would break the site rather than protect it. Violations land in the
    # browser console, which is the inventory this has to be built from; when
    # it is empty, this becomes the enforced header above.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # The NDJSON bulk dumps, served straight off disk. The app cannot do this:
    # its static mount covers generated/ only, and /api/v1/dumps is a manifest
    # (source, filename, size), not a download route -- so without this block
    # every file the manifest advertises 404s. They are also the wrong shape for
    # uvicorn: forarbete.ndjson.gz alone is ~3.6 GB and the set is ~4.5 GB, which
    # nginx streams with sendfile and byte ranges instead of pinning an async
    # worker for the length of a multi-gigabyte transfer.
    #
    # The directory is the same `dumps/` inside the site's data_root that
    # `lagen all dump` writes (mounted read-only, see docker-compose.prod.yml).
    # Files land world-readable (0644) under a 0755 dir, which is what lets the
    # nginx worker (uid 101, not root -- /mnt/forstor is root_squashed NFS) read
    # them at all.
    location /dumps/ {
        alias /usr/share/nginx/dumps/;
        autoindex on;                  # a plain index, so the set is browsable
        autoindex_exact_size off;
        autoindex_localtime on;
        gzip off;                      # the payload is already gzip
        # nginx replaces, never merges, add_header across scopes: declaring any
        # here drops the whole server-scope set, so all four are repeated --
        # a dump URL can be the first thing a client touches on this host, and
        # dropping HSTS on that response is exactly when it is load-bearing.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Analytics: the whole self-hosted Matomo container -- the tracker endpoints
    # the pages' snippet (lib/assets/matomo.js) posts to, and the admin UI at
    # /matomo/.
    #
    # The tracker is here so the snippet is *same-origin*: a cross-origin
    # tracker is what browser tracking protection blocks first, and Matomo
    # switches to POST for long payloads, which cross-origin would need CORS
    # for. The UI is here because it used to be reachable only through
    # old.lagen.nu (default.conf), the legacy vhost, which is due to be retired
    # -- the one place to read the numbers must not live on the host that goes
    # away. default.conf keeps its own /matomo/ block until that happens, so
    # both addresses answer during the changeover.
    #
    # `^~` so this prefix beats the regex locations below without them having to
    # know about it; a proxy_pass carrying variables does no automatic URI
    # rewriting, hence the explicit rewrite that strips the prefix.
    #
    # Host is pinned to lagen.nu because Matomo's config.ini.php trusts that
    # name only. For the tracker nothing about the report depends on it (the
    # page tracked rides in the request's own `url` parameter, and the site id,
    # not the hostname, separates the rebuilt site from legacy); for the UI it
    # is what the absolute URLs Matomo generates are built from, which is now
    # the truth. `X-Forwarded-Uri` tells Matomo it is mounted under a subpath,
    # the header default.conf has always sent it for exactly that reason.
    location = /matomo { return 301 /matomo/; }

    location ^~ /matomo/ {
        # Runtime resolver + variable upstream: nginx resolves a *literal*
        # upstream name at config load and refuses to start if it does not
        # resolve, so a literal here would make every nginx boot depend on the
        # Matomo container. Analytics should not be able to hold the site
        # hostage, so this block does not add such a dependency. Note it does
        # not yet *remove* one either: default.conf's own /matomo/ block (and
        # its mediawiki blocks) still use literals, so a missing matomo still
        # stops nginx today -- retiring that vhost, or giving it the same
        # treatment, is what would make this guarantee real. `location /` below
        # keeps its literal deliberately: the app being absent is a reason not
        # to serve.
        resolver 127.0.0.11 valid=10s;
        set $matomo_upstream matomo;
        rewrite ^/matomo/(.*)$ /$1 break;
        proxy_pass http://$matomo_upstream;
        proxy_set_header Host lagen.nu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri /matomo;
        proxy_redirect off;
        # nginx replaces, never merges, add_header across scopes -- see /dumps/.
        # Deliberately not the server's CSP: the UI is Matomo's own application,
        # inline scripts and styles included, and a policy written for our
        # generated pages would break it rather than protect it.
        #
        # That argument only covers script-src/style-src, though, so this drops
        # more than it has to: frame-ancestors, object-src, base-uri and
        # form-action would cost the UI nothing and are the directives that
        # matter for a login form on the indexed apex. Restoring them needs one
        # `curl -I` through this block against the real container first --
        # X-Frame-Options DENY in particular would block Matomo's own
        # same-origin widget iframes, and that is not verified from here.
        # Open, 2026-09-07.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # URLs the legacy application published that this one does not answer.
    # The browse landings moved into each source's own tree, /utr/ was an
    # alias for the utredningar's own paths, and the per-document RDF/JSON/XHTML
    # twins have no successor: 410 tells a crawler to forget them, where a 404
    # keeps them queued for re-checks. Exact and regex locations; `location /`
    # below keeps everything else.
    location = /dataset/sfs     { return 301 /sfs/; }
    location = /dataset/dv      { return 301 /dom/; }
    location = /dataset/myndfs  { return 301 /myndigheter/; }
    location = /dataset/keyword { return 301 /begrepp/; }
    location ~ ^/utr/(sou|ds)/(.+)$ { return 301 /$1/$2; }
    # quoted: an unquoted `{4}` reads as a block opener and nginx refuses to start
    location ~ "^/(\d{4}:[^/]+|dom/[^/]+/[^/]+|prop/[^/]+/[^/]+|(?:sou|ds|dir|begrepp)/[^/]+|[a-z-]+fs/[^/]+)\.(rdf|ttl|nt|json|xhtml)$" {
        return 410;
    }

    # the facsimile images: the same proxy as `location /`, behind the
    # host-wide render budget declared at the top of this file. `burst`
    # lets a reader open a spread of pages at once; `nodelay` answers the
    # excess immediately rather than holding the connection.
    location ~ "^/[a-z]+/[^/]+(/[^/]+)*/sid[0-9]+\.png$" {
        if ($http_user_agent ~* "img2dataset|ImageBot") { return 403; }
        limit_req zone=crop burst=20 nodelay;
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # The two API crop routes, the same renderer the legacy
    # /<basefile>/sidN.png path reaches, behind the same kind of budget.
    # `sfs-graphic` is here rather than falling through to `location /`
    # because it renders exactly as `facsimile` does -- it is the route a
    # statute page of road signs hits hundreds of times.
    location ~ "^/api/v1/(facsimile|sfs-graphic)$" {
        limit_req zone=crop burst=20 nodelay;
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/v1/pdf {
        limit_req zone=export burst=10 nodelay;
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Only this route needs it. GET /api/v1/pdf lays a document out
        # with WeasyPrint, and a caller who waited was answered 504 for a
        # render that then succeeded and filled the cache for nobody. The
        # site's own PDF button no longer waits on a request at all (it
        # follows a job, api/pdfjob.py); this covers a direct API call.
        # Everything else stays at nginx's 60 s default -- a search that
        # holds a connection for ten minutes is a fault, not patience.
        proxy_read_timeout 600s;
    }
}

# Every old ferenda.lagen.nu URL answers a permanent redirect to the same
# path on lagen.nu, the block above. Keep it indefinitely -- the hostname was
# public for months, and search engines need the redirect to move their
# index. 308, not 301: a client that follows a 301 turns a POST into a GET,
# which breaks every MCP and API consumer still configured with the old
# host; 308 keeps the method and the body, and is permanent for crawlers.

server {
    listen 80;
    server_name ferenda.lagen.nu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://lagen.nu$request_uri; }
}

server {
    listen 443 ssl;
    server_name ferenda.lagen.nu;
    ssl_certificate /usr/share/nginx/certificates/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certificates/privkey.pem;
    include /etc/ssl-options/options-nginx-ssl.conf;
    ssl_dhparam /etc/ssl-options/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://lagen.nu$request_uri;
}
