# The rebuilt site: ferenda.lagen.nu today, lagen.nu after the cutover.
#
# The `ferenda` service serves the whole thing from one uvicorn process: the REST APIs
# (the public /api/v1/* with /docs + /openapi.json, and the site's own
# /internal-api/v1/*, which the app itself limits to same-origin callers)
# answer first, everything else is the
# generated static site, and its SiteFiles handler resolves lagen.nu's bare
# document URLs (/2018:585, /dom/ad/1993:100, ...) internally. So nginx does
# not replicate the try_files/rewrite grammar the legacy lagen.nu vhost needs
# (default.conf) -- it just reverse-proxies every request to the app.
#
# The service name `ferenda` resolves on the compose network (see
# docker-compose.yml); the app listens on :8000.
#
# CUTOVER (September): swap the two marked `server_name` lines, then uncomment
# the redirect block at the foot of this file. docker-compose.yml carries the
# full order of operations.

server {
    listen 80;
    server_name ferenda.lagen.nu;      # CUTOVER: replace with `lagen.nu;`

    # keep ACME http-01 challenges answerable (shared webroot with lagen.nu)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ferenda.lagen.nu;      # CUTOVER: replace with `lagen.nu;`

    # Shares lagen.nu's certificate files. Add `ferenda.lagen.nu` to the nginx
    # service's DOMAIN env (docker-compose.yml) so the ACME client reissues one
    # SAN cert covering both names. Referencing the existing files means nginx
    # still boots before that reissue -- TLS just warns for this name until then.
    ssl_certificate /usr/share/nginx/certificates/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certificates/privkey.pem;
    include /etc/ssl-options/options-nginx-ssl.conf;
    ssl_dhparam /etc/ssl-options/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    client_max_body_size 4m;
    server_tokens off;                 # don't advertise the nginx version

    # The rebuilt site is a not-yet-promoted duplicate of lagen.nu's content, so
    # it must never be indexed or treated as canonical over lagen.nu. X-Robots-Tag
    # noindex is the load-bearing signal: robots.txt (served from the generated
    # root) now PERMITS crawling on purpose, because a crawler has to fetch the
    # page to see this header -- a blanket Disallow would hide it and risk the URL
    # being indexed by reference only. `always` so it rides error responses too.
    # These sit at server scope and reach the proxied response because `location /`
    # declares no add_header of its own (nginx replaces, never merges, per
    # location). Drop the X-Robots-Tag when this host is promoted to canonical.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The NDJSON bulk dumps, served straight off disk. The app cannot do this:
    # its static mount covers generated/ only, and /api/v1/dumps is a manifest
    # (source, filename, size), not a download route -- so without this block
    # every file the manifest advertises 404s. They are also the wrong shape for
    # uvicorn: forarbete.ndjson.gz alone is ~3.6 GB and the set is ~4.5 GB, which
    # nginx streams with sendfile and byte ranges instead of pinning an async
    # worker for the length of a multi-gigabyte transfer.
    #
    # The directory is the same `dumps/` inside the site's data_root that
    # `lagen all dump` writes (mounted read-only, see docker-compose.prod.yml).
    # Files land world-readable (0644) under a 0755 dir, which is what lets the
    # nginx worker (uid 101, not root -- /mnt/forstor is root_squashed NFS) read
    # them at all.
    location /dumps/ {
        alias /usr/share/nginx/dumps/;
        autoindex on;                  # a plain index, so the set is browsable
        autoindex_exact_size off;
        autoindex_localtime on;
        gzip off;                      # the payload is already gzip
        # nginx replaces, never merges, add_header across scopes: declaring any
        # here drops the whole server-scope set, so all four are repeated --
        # a dump URL can be the first thing a client touches on this host, and
        # dropping HSTS on that response is exactly when it is load-bearing.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Analytics: the tracker endpoints of the same self-hosted Matomo container
    # lagen.nu uses (default.conf's /matomo/ block), exposed here so the pages'
    # snippet (lib/assets/matomo.js) is *same-origin* -- a cross-origin tracker
    # is what browser tracking protection blocks first, and Matomo switches to
    # POST for long payloads, which cross-origin would need CORS for.
    #
    # Only matomo.php (the tracking endpoint) and matomo.js/piwik.js (the tracker
    # script) -- the Matomo admin UI stays at lagen.nu/matomo/ and is not
    # duplicated onto this host. A regex location cannot carry a URI on
    # proxy_pass, hence the rewrite.
    #
    # Host is pinned to lagen.nu because Matomo's config.ini.php trusts that name
    # only; the page being tracked is carried in the tracking request's own `url`
    # parameter, so nothing about the report depends on this header. The site id
    # (not the hostname) is what separates the rebuilt site from legacy.
    location ~ ^/matomo/(matomo|piwik)\.(php|js)$ {
        # Runtime resolver + variable upstream: nginx resolves a *literal*
        # upstream name at config load and refuses to start if it does not
        # resolve, so a literal here would make every nginx boot depend on the
        # Matomo container. Analytics should not be able to hold the site
        # hostage, so this block does not add such a dependency. Note it does
        # not yet *remove* one either: default.conf's own /matomo/ block (and
        # its mediawiki blocks) still use literals, so a missing matomo still
        # stops nginx today -- giving those the same treatment is what would
        # make this guarantee real. `location /` below keeps its literal
        # deliberately: the app being absent is a reason not to serve.
        resolver 127.0.0.11 valid=10s;
        set $matomo_upstream matomo;
        rewrite ^/matomo/(.*)$ /$1 break;
        proxy_pass http://$matomo_upstream;
        proxy_set_header Host lagen.nu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # nginx replaces, never merges, add_header across scopes -- see /dumps/
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/v1/pdf {
        proxy_pass http://ferenda:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Only this route needs it. GET /api/v1/pdf lays a document out
        # with WeasyPrint, and a caller who waited was answered 504 for a
        # render that then succeeded and filled the cache for nobody. The
        # site's own PDF button no longer waits on a request at all (it
        # follows a job, api/pdfjob.py); this covers a direct API call.
        # Everything else stays at nginx's 60 s default -- a search that
        # holds a connection for ten minutes is a fault, not patience.
        proxy_read_timeout 600s;
    }
}

